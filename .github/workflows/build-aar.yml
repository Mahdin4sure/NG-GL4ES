name: Build AAR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIB_NAME: ng_gl4es
  MIN_SDK: "24"

jobs:
  build-native:
    name: Native (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake

      - name: Configure
        run: |
          cmake -S . -B build/${{ matrix.abi }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${MIN_SDK} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --target ${LIB_NAME} --parallel

      - name: Collect library
        run: |
          mkdir -p out/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/lib${LIB_NAME}.so out/${{ matrix.abi }}/

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/lib${{ env.LIB_NAME }}.so
          if-no-files-found: error

  package-aar:
    name: Package AAR
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native

      - name: Read version
        id: ver
        run: |
          major=$(sed -n 's/^#define MAJOR \(.*\)/\1/p' version.h)
          minor=$(sed -n 's/^#define MINOR \(.*\)/\1/p' version.h)
          rev=$(sed -n 's/^#define REVISION \(.*\)/\1/p' version.h)
          echo "version=${major}.${minor}.${rev}" >> "$GITHUB_OUTPUT"

      - name: Assemble AAR
        run: |
          set -e
          root=aar-root
          mkdir -p "$root/jni" "$root/META-INF"

          for dir in native/native-*; do
            abi="${dir#native/native-}"
            mkdir -p "$root/jni/$abi"
            cp "$dir/lib${LIB_NAME}.so" "$root/jni/$abi/"
          done

          cat > "$root/AndroidManifest.xml" << MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="io.github.maxjubayeryt.nggl4es">
              <uses-sdk android:minSdkVersion="${MIN_SDK}" />
          </manifest>
          MANIFEST

          # AAR requires classes.jar; this library is native-only so it is empty
          mkdir -p jar-tmp/META-INF
          printf 'Manifest-Version: 1.0\n' > jar-tmp/META-INF/MANIFEST.MF
          (cd jar-tmp && zip -qr ../"$root"/classes.jar META-INF)

          : > "$root/R.txt"
          cp LICENSE "$root/META-INF/LICENSE"

          mkdir -p dist
          aar="dist/${LIB_NAME}-${{ steps.ver.outputs.version }}.aar"
          (cd "$root" && zip -qr ../"$aar" .)

          echo "Contents:"
          unzip -l "$aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LIB_NAME }}-aar
          path: dist/*.aar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.aar
